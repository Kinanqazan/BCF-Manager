name: Build and publish portable release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build app and portable ZIP
        shell: pwsh
        run: .\build.ps1 -OutputDirectory release

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" "release/BCF-Manager-Portable.zip" --repo "${{ github.repository }}" --title "BCF Manager $env:GITHUB_REF_NAME" --generate-notes
